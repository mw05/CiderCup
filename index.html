            <!-- Status & Action Block -->

                    type="submit" 
                    id="submitBtn"
                    class="w-full py-3.5 px-6 rounded-xl text-white font-semibold bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-200 transition-all shadow-md active:scale-[0.99] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center space-x-2"
                >
                    <span id="btnText">Submit Entry</span>
                    <svg id="btnSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>

                <!-- Status Feedback Banner -->
                <div id="statusBox" class="hidden p-4 rounded-xl text-sm font-medium"></div>
            </div>

    </div>

    <script>
    // HARDCODE YOUR DEPLOYED URL HERE
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPru9sZJmvtLlWxb-KWmwejUyWYEZ8A2sITdRyMYCRpbjNX-bPFIzt8beCo9KkDhBekg/exec";

    // Form elements
    const form = document.getElementById('selectionForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const statusBox = document.getElementById('statusBox');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Set Loading UI State
        setLoading(true);
        hideStatus();

        // Build payload matching Google Apps Script structure
        const payload = {
            name: document.getElementById('name').value,
            r1_sel1: document.getElementById('r1_sel1').value,
            r1_sel2: document.getElementById('r1_sel2').value,
            r2_sel1: document.getElementById('r2_sel1').value,
            r2_sel2: document.getElementById('r2_sel2').value,
            r3_sel1: document.getElementById('r3_sel1').value,
            r3_sel2: document.getElementById('r3_sel2').value
        };

        // Post request to Google Apps Script
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // Bypasses strict CORS issues for Google Web Apps
            headers: {
                'Content-Type': 'text/plain'
            },
            body: JSON.stringify(payload)
        })
        .then(() => {
            showStatus('Success! Your selections have been saved.', 'success');
            form.reset();
        })
        .catch(err => {
            console.error('Submission error:', err);
            showStatus('An error occurred while submitting. Please try again.', 'error');
        })
        .finally(() => {
            setLoading(false);
        });
    });

    function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        if (isLoading) {
            btnText.textContent = 'Submitting...';
            btnSpinner.classList.remove('hidden');
        } else {
            btnText.textContent = 'Submit Entry';
            btnSpinner.classList.add('hidden');
        }
    }

    function showStatus(message, type) {
        statusBox.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-rose-50', 'text-rose-800', 'border-rose-200');
        statusBox.classList.add('border');
        
        if (type === 'success') {
            statusBox.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-200');
        } else {
            statusBox.classList.add('bg-rose-50', 'text-rose-800', 'border-rose-200');
        }
        
        statusBox.textContent = message;
    }

    function hideStatus() {
        statusBox.classList.add('hidden');
    }
</script>

</html>
