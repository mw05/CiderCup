<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selections - Fantasy Cider Cup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #tableHeader th {
      padding: 0.75rem 1rem; 
    }

    #tableBody td {
      padding: 0.75rem 1rem; 
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-0 sm:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Shared Top Navigation Header -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between py-2.5 sm:py-0 sm:h-16 gap-2 sm:gap-0">
          <!-- App Brand / Logo -->
          <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-emerald-400 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-emerald-900/40">
              <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm0 0h18" />
              </svg>
            </div>
            <span class="font-bold text-base sm:text-lg text-white tracking-tight whitespace-nowrap">Fantasy Cider Cup</span>
          </div>

          <!-- Navigation Links -->
          <nav class="flex items-center space-x-1 sm:space-x-2 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
            <a href="selections.html" class="px-3.5 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition-colors">
              My Picks
            </a>
            <a href="results.html" class="px-3.5 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition-colors">
              Leaderboard
            </a>
            <a href="fixtures.html" class="px-3.5 py-2 rounded-lg text-sm font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 shadow-sm flex items-center space-x-2">
              Entries
            </a>
            <a href="scores.html" class="px-3.5 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition-colors">
              Scorecards
            </a>
            <a href="rules.html" class="px-3.5 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition-colors">
              Rules
            </a>
          </nav>
        </div>
      </div>
    </header>

    <!-- Entry Count Bar -->
    <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/60 flex items-center justify-between">
      <div id="rowCount" class="text-xs text-slate-400">
        Total Participant Entries: <span id="visibleCount" class="font-bold text-emerald-400 text-sm">0</span>
      </div>
    </div>

    <!-- Status Messages -->
    <div id="statusMsg" class="p-4 rounded-lg bg-indigo-950/50 border border-indigo-800 text-indigo-300 text-sm hidden">
      Loading participant selections...
    </div>

    <!-- Selections Table -->
    <div class="bg-slate-800/40 rounded-xl border border-slate-700/60 overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead id="tableHeader" class="bg-slate-800/90 text-slate-300 border-b border-slate-700 uppercase text-[11px] font-bold tracking-wider">
            <!-- Dynamic Headers -->
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-800/80 text-slate-300 font-medium">
            <!-- Dynamic Rows -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Updated Script URL pointing to your deployment
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJJEuJRZ2xui_lEFFKxX-slTN-cDVzk2ib0wx0F1YJOkIkTsSac2UxHUrlgxtHv0LyIA/exec?type=selections";

    async function loadSelections() {
      const statusMsg = document.getElementById('statusMsg');
      const tableHeader = document.getElementById('tableHeader');
      const tableBody = document.getElementById('tableBody');

      statusMsg.textContent = "Fetching selections from Google Sheet...";
      statusMsg.classList.remove('hidden', 'bg-red-950/50', 'text-red-300', 'border-red-800');
      statusMsg.classList.add('bg-indigo-950/50', 'text-indigo-300', 'border-indigo-800');

      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        statusMsg.classList.add('hidden');

        if (!data || data.length === 0) {
          tableHeader.innerHTML = '';
          tableBody.innerHTML = `<tr><td class="p-8 text-center text-slate-500">No entry records found in the Selections sheet.</td></tr>`;
          document.getElementById('visibleCount').textContent = 0;
          return;
        }

        renderSelectionsTable(data);

      } catch (error) {
        console.error("Fetch error:", error);
        statusMsg.textContent = "Failed to load selections: " + error.message;
        statusMsg.classList.remove('hidden', 'bg-indigo-950/50', 'text-indigo-300', 'border-indigo-800');
        statusMsg.classList.add('bg-red-950/50', 'text-red-300', 'border-red-800');
      }
    }

   function renderSelectionsTable(items) {
  const tableHeader = document.getElementById('tableHeader');
  const tableBody = document.getElementById('tableBody');

  // Map sheet column names to custom display titles
  const headerMap = {
    'R1 Selection 1': 'Four Ball 1',
    'R1 Selection 2': 'Four Ball 2',
    'R2 Selection 1': 'Scramble 1',
    'R2 Selection 2': 'Scramble 2',
    'R3 Selection 1': 'Singles 1',
    'R3 Selection 2': 'Singles 2'
  };

  // Extract raw column keys and filter OUT the Captain column header
  const rawColumns = Object.keys(items[0]);
  const visibleColumns = rawColumns.filter(col => !col.toLowerCase().includes('captain'));

  // Render Headers using mapped names (or fallback to original name if not in map)
  tableHeader.innerHTML = `
    <tr>
      <th class="px-4 py-3 border-b border-slate-700 w-12 text-center text-slate-500">#</th>
      ${visibleColumns.map(col => `
        <th class="px-4 py-3 border-b border-slate-700 whitespace-nowrap">${headerMap[col] || col}</th>
      `).join('')}
    </tr>
  `;

  // Helper to format values
  const formatCellValue = (colName, cellVal, captainName) => {
    if (!cellVal) return '<span class="text-slate-600">-</span>';

    const key = colName.toLowerCase();

    // Style Participant Name
    if (key === 'name') {
      return `<span class="font-bold text-white text-sm">${cellVal}</span>`;
    }

    // Check if this selection matches the row's Captain selection
    const isCaptainMatch = captainName && String(cellVal).trim().toLowerCase() === String(captainName).trim().toLowerCase();

    if (isCaptainMatch) {
      return `<span class="inline-flex items-center space-x-1 font-bold text-amber-300 bg-amber-500/10 border border-amber-500/30 px-2.5 py-1 rounded-lg">
                <span>👑</span> <span>${cellVal}</span>
              </span>`;
    }

    // Standard golfer selection
    return `<span class="text-slate-200 bg-slate-900/80 px-2.5 py-1 rounded-md border border-slate-700/80 whitespace-nowrap">${cellVal}</span>`;
  };

  // Render Rows
  tableBody.innerHTML = items.map((row, index) => {
    // Find the captain's name for this specific row
    const captainKey = rawColumns.find(col => col.toLowerCase().includes('captain'));
    const captainName = captainKey ? row[captainKey] : null;

    return `
      <tr class="hover:bg-slate-800/60 transition-colors">
        <td class="px-4 py-3.5 whitespace-nowrap text-center text-slate-500 font-mono text-xs">${index + 1}</td>
        ${visibleColumns.map(col => `
          <td class="px-4 py-3.5 whitespace-nowrap">${formatCellValue(col, row[col], captainName)}</td>
        `).join('')}
      </tr>
    `;
  }).join('');

  document.getElementById('visibleCount').textContent = items.length;
}

    window.addEventListener('DOMContentLoaded', loadSelections);
  </script>

</body>
</html>
