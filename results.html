<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results Leaderboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Navigation Header -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-5">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-white">Results Leaderboard</h1>
        <p class="text-slate-400 text-sm mt-1">Live scores sorted by total points</p>
      </div>
      <div class="flex items-center gap-3">
        <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm transition">
          ← Back to Form
        </a>
        <button id="refreshBtn" onclick="loadResults()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
          <span>Refresh</span>
        </button>
      </div>
    </header>

    <!-- Entry Count & Info Bar -->
    <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/60 flex items-center justify-between">
      <div class="text-sm text-slate-300">
        Sorted automatically by <span class="font-semibold text-indigo-400">Total Points</span> (Highest to Lowest)
      </div>
      <div id="rowCount" class="text-xs text-slate-400">
        Total Entries: <span id="visibleCount" class="font-bold text-white">0</span>
      </div>
    </div>

    <!-- Status Messages -->
    <div id="statusMsg" class="p-4 rounded-lg bg-indigo-950/50 border border-indigo-800 text-indigo-300 text-sm hidden">
      Loading leaderboard from Google Sheets...
    </div>

    <!-- Results Table -->
    <div class="bg-slate-800/40 rounded-xl border border-slate-700/60 overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead id="tableHeader" class="bg-slate-800 text-slate-300 border-b border-slate-700 uppercase text-xs font-semibold tracking-wider">
            <!-- Dynamic Headers -->
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-800 text-slate-300">
            <!-- Dynamic Rows -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Paste your exact Google Apps Script URL here
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPru9sZJmvtLlWxb-KWmwejUyWYEZ8A2sITdRyMYCRpbjNX-bPFIzt8beCo9KkDhBekg/exec";

    async function loadResults() {
      const statusMsg = document.getElementById('statusMsg');
      const tableHeader = document.getElementById('tableHeader');
      const tableBody = document.getElementById('tableBody');

      statusMsg.textContent = "Fetching latest sheet data...";
      statusMsg.classList.remove('hidden', 'bg-red-950/50', 'text-red-300', 'border-red-800');
      statusMsg.classList.add('bg-indigo-950/50', 'text-indigo-300', 'border-indigo-800');

      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        statusMsg.classList.add('hidden');

        if (!data || data.length === 0) {
          tableHeader.innerHTML = '';
          tableBody.innerHTML = `<tr><td class="p-8 text-center text-slate-500">No records found in the results sheet.</td></tr>`;
          document.getElementById('visibleCount').textContent = 0;
          return;
        }

        // Sort data by total points (descending order)
        const sortedData = sortDataByPoints(data);

        renderTable(sortedData);

      } catch (error) {
        console.error("Fetch error:", error);
        statusMsg.textContent = "Failed to load data: " + error.message;
        statusMsg.classList.remove('hidden', 'bg-indigo-950/50', 'text-indigo-300', 'border-indigo-800');
        statusMsg.classList.add('bg-red-950/50', 'text-red-300', 'border-red-800');
      }
    }

    function sortDataByPoints(items) {
      if (items.length === 0) return items;

      // If a matching points/score column is found, sort descending
      if (pointsKey) {
        return items.sort((a, b) => {
          const valA = parseFloat(a['Total']) || 0;
          const valB = parseFloat(b['Total']) || 0;
          return valB - valA; // Descending order (highest first)
        });
      }

      // Fallback: Return unsorted if no points column was matched
      return items;
    }

    function renderTable(items) {
      const tableHeader = document.getElementById('tableHeader');
      const tableBody = document.getElementById('tableBody');

      if (items.length === 0) {
        tableBody.innerHTML = `<tr><td class="p-8 text-center text-slate-500">No records found.</td></tr>`;
        document.getElementById('visibleCount').textContent = 0;
        return;
      }

      // Extract keys from first item to build dynamic columns
      const columns = Object.keys(items[0]);

      // Header row
      tableHeader.innerHTML = `
        <tr>
          ${columns.map(col => `<th class="px-6 py-3 border-b border-slate-700">${col}</th>`).join('')}
        </tr>
      `;

      // Data rows
      tableBody.innerHTML = items.map(row => `
        <tr class="hover:bg-slate-800/50 transition">
          ${columns.map(col => `<td class="px-6 py-4 whitespace-nowrap">${row[col] ?? ''}</td>`).join('')}
        </tr>
      `).join('');

      document.getElementById('visibleCount').textContent = items.length;
    }

    // Auto-load results when the page loads
    window.addEventListener('DOMContentLoaded', loadResults);
  </script>

</body>
</html>
